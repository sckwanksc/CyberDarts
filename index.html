<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>倉頡神射手：字母四大分類飛鏢大挑戰</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at center, #f0fdf4 0%, #e0f2fe 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    /* 加高整個遊戲容器 */
    #game-container {
      width: 100%;
      max-width: 980px;
      min-height: 760px;
      background: #ffffff;
      border: 3px solid #38bdf8;
      border-radius: 24px;
      box-shadow: 0 20px 48px rgba(14, 165, 233, 0.22);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 頂部資訊列 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
      padding: 14px 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .user-info-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
      color: #0369a1;
      background: #e0f2fe;
      padding: 8px 16px;
      border-radius: 12px;
      border: 1.5px solid #bae6fd;
    }
    .score-stats {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .stat-pill {
      font-size: 14px;
      font-weight: 800;
      color: #334155;
      background: #f1f5f9;
      padding: 7px 15px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
    }
    .stat-pill b {
      color: #0284c7;
      font-size: 17px;
    }

    /* 主體區塊 */
    .main-body {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* 階段一：答題區（加高加寬版） */
    #quiz-section {
      padding: 34px 24px;
      min-height: 600px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 22px;
    }
    .quiz-card {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.07);
      position: relative;
    }
    .quiz-progress-text {
      font-size: 14px;
      font-weight: 800;
      color: #0284c7;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 12px;
    }
    .target-letter-display {
      width: 130px;
      height: 130px;
      margin: 12px auto;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border-radius: 26px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(2, 132, 199, 0.38);
      border: 3.5px solid #bae6fd;
    }
    .target-letter-char {
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
    }
    .quiz-question-title {
      font-size: 21px;
      font-weight: 800;
      color: #0f172a;
      margin: 16px 0 22px;
    }
    .category-options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }
    .btn-opt {
      background: #f8fafc;
      border: 2.5px solid #cbd5e1;
      border-radius: 16px;
      padding: 18px;
      font-size: 18px;
      font-weight: 800;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-opt:hover:not(:disabled) {
      border-color: #0284c7;
      background: #e0f2fe;
      transform: translateY(-2px);
    }
    .btn-opt.correct {
      background: #dcfce7 !important;
      border-color: #16a34a !important;
      color: #15803d !important;
      font-weight: 900;
    }
    .btn-opt.wrong {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #991b1b !important;
    }

    /* 答題回饋卡（公布答案與鼓勵版） */
    .feedback-box {
      width: 100%;
      max-width: 720px;
      border-radius: 18px;
      padding: 22px 26px;
      font-size: 15.5px;
      line-height: 1.6;
      text-align: left;
      display: none;
      animation: fadeIn 0.3s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .feedback-box.success {
      background: #dcfce7;
      border: 2px solid #86efac;
      color: #166534;
    }
    .feedback-box.encouragement {
      background: #fffbeb;
      border: 2px solid #fde68a;
      color: #92400e;
    }
    .feedback-box .answer-banner {
      font-size: 18px;
      font-weight: 900;
      color: #b45309;
      background: #fef3c7;
      padding: 10px 16px;
      border-radius: 12px;
      border-left: 6px solid #d97706;
      margin-bottom: 12px;
    }
    .feedback-box .encourage-text {
      font-weight: 800;
      font-size: 16px;
      color: #1e3a8a;
      margin-bottom: 8px;
    }
    .feedback-box .hint-text {
      font-weight: 700;
      color: #475569;
      margin-bottom: 16px;
    }
    .btn-next-question {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 14px 26px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
      transition: all 0.2s;
    }
    .btn-next-question:hover {
      background: #0284c7;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.45);
    }

    /* 階段二：正面視角飛鏢遊戲區（加高至 500px） */
    #dart-section {
      display: none;
      flex-direction: column;
      background: #ffffff;
      flex: 1;
    }
    .dart-stage-wrapper {
      position: relative;
      background: radial-gradient(circle at 50% 40%, #ffffff 0%, #e2e8f0 70%, #cbd5e1 100%);
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 2px solid #e2e8f0;
    }
    canvas#dartCanvas {
      display: block;
      width: 100%;
      max-width: 820px;
      height: 500px;
    }

    /* 飛鏢控制列 */
    .dart-controls-bar {
      background: #f8fafc;
      padding: 18px 24px;
      display: grid;
      grid-template-columns: 1fr 1.3fr 1.1fr;
      gap: 18px;
      align-items: center;
    }
    @media (max-width: 780px) {
      .dart-controls-bar {
        grid-template-columns: 1fr;
      }
    }
    .control-card {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-title {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 800;
      color: #334155;
    }
    .control-title span.val {
      color: #0284c7;
      font-size: 15px;
      font-weight: 900;
    }
    .control-card input[type="range"] {
      width: 100%;
      height: 9px;
      border-radius: 5px;
      background: #cbd5e1;
      outline: none;
      accent-color: #0284c7;
      cursor: pointer;
    }

    /* 加強版蓄力條外槽 */
    .power-gauge-track {
      width: 100%;
      height: 26px;
      background: #1e293b;
      border-radius: 13px;
      overflow: hidden;
      border: 2px solid #475569;
      position: relative;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
    }
    .power-gauge-marks {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      padding: 0 4px;
      z-index: 2;
    }
    .power-mark {
      width: 1.5px;
      height: 100%;
      background: rgba(255, 255, 255, 0.25);
    }
    .power-gauge-fill {
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, #10b981 0%, #38bdf8 35%, #f59e0b 70%, #ef4444 100%);
      border-radius: 11px;
      transition: width 0.03s linear;
      position: relative;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.85);
    }
    .power-gauge-fill::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: #ffffff;
      box-shadow: 0 0 8px #ffffff;
    }

    /* 蓄力發射按鈕 */
    .btn-charge-throw {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      color: #ffffff;
      font-size: 16.5px;
      font-weight: 900;
      border: none;
      border-radius: 16px;
      padding: 16px 20px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(22, 163, 74, 0.35);
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }
    .btn-charge-throw.charging {
      background: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
      transform: scale(0.97);
      box-shadow: 0 0 22px rgba(239, 68, 68, 0.65);
      animation: pulseBtn 0.4s infinite alternate;
    }
    @keyframes pulseBtn {
      from { filter: brightness(1); }
      to { filter: brightness(1.2); }
    }
    .btn-charge-throw:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      animation: none;
    }

    /* 浮動命中/射失通知 */
    .dart-hit-toast {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      color: #ffffff;
      font-size: 16.5px;
      font-weight: 900;
      padding: 12px 28px;
      border-radius: 32px;
      border: 2px solid #38bdf8;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      max-width: 90%;
      text-align: center;
    }
    .dart-hit-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(10px) scale(1.02);
    }
    .dart-hit-toast.bullseye {
      border-color: #ef4444;
      background: rgba(185, 28, 28, 0.96);
      color: #fef08a;
      box-shadow: 0 0 26px rgba(239, 68, 68, 0.85);
    }
    .dart-hit-toast.miss {
      border-color: #f59e0b;
      background: rgba(30, 41, 59, 0.96);
      color: #fef08a;
    }

    /* 彈窗（登入與結算） */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 99999;
    }
    .modal-overlay.hidden { display: none !important; }
    .modal-card {
      background: #ffffff;
      border: 3px solid #38bdf8;
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      padding: 32px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      margin: 20px 0 10px;
    }
    .form-group {
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 700;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.18);
    }
    .btn-login {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      padding: 15px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
      transition: all 0.2s;
    }
    .btn-login:hover {
      background: #0284c7;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(2, 132, 199, 0.45);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 頂部資訊列 -->
    <div class="header-bar">
      <div class="user-info-badge">
        <span>👤 特工：</span>
        <span id="ui-student-label">未登入</span>
      </div>
      <div class="score-stats">
        <div class="stat-pill">進度：<b id="ui-round">1 / 10</b></div>
        <div class="stat-pill">答題得分：<b id="ui-quiz-score">0</b></div>
        <div class="stat-pill">飛鏢得分：<b id="ui-dart-score">0</b></div>
        <div class="stat-pill">總分：<b id="ui-total-score" style="color:#16a34a;">0</b></div>
      </div>
    </div>

    <div class="main-body">
      <!-- 階段一：答題區（加高視界版） -->
      <section id="quiz-section">
        <div class="quiz-card">
          <div class="quiz-progress-text">🎯 第一階段：倉頡字根辨析挑戰</div>

          <div class="target-letter-display">
            <div class="target-letter-char" id="quiz-letter-char">日</div>
          </div>

          <div class="quiz-question-title">
            請問這個倉頡字母屬於哪一個大類？
          </div>

          <div class="category-options-grid">
            <button class="btn-opt" onclick="selectAnswer('哲理類')">哲理類</button>
            <button class="btn-opt" onclick="selectAnswer('筆畫類')">筆畫類</button>
            <button class="btn-opt" onclick="selectAnswer('人體類')">人體類</button>
            <button class="btn-opt" onclick="selectAnswer('字形類')">字形類</button>
          </div>
        </div>

        <!-- 答題回饋卡（修復 display 邏輯與換題按鈕） -->
        <div class="feedback-box" id="quiz-feedback-box">
          <div class="answer-banner" id="fb-answer-banner"></div>
          <div class="hint-text" id="fb-hint"></div>
          <div class="encourage-text" id="fb-encourage"></div>
          <div id="fb-action-area" style="margin-top:16px;"></div>
        </div>
      </section>

      <!-- 階段二：正面向前投擲飛鏢挑戰（加高畫布至 500px） -->
      <section id="dart-section">
        <div class="dart-stage-wrapper">
          <div class="dart-hit-toast" id="dartToast">🎯 完美命中紅心！+50 分</div>
          <canvas id="dartCanvas" width="820" height="500"></canvas>
        </div>

        <div class="dart-controls-bar">
          <!-- 左右偏角調節滑桿 -->
          <div class="control-card">
            <div class="control-title">
              <span>📐 瞄準偏角 (Angle)</span>
              <span class="val" id="val-angle">0.0°</span>
            </div>
            <input type="range" id="input-angle" min="-25" max="25" step="0.5" value="0" oninput="updateAimAngle()">
          </div>

          <!-- 加強版力度蓄力顯示條 -->
          <div class="control-card">
            <div class="control-title">
              <span>⚡ 投擲能量蓄力 (Power)</span>
              <span class="val" id="val-power">30%</span>
            </div>
            <div class="power-gauge-track">
              <div class="power-gauge-marks">
                <div class="power-mark"></div>
                <div class="power-mark"></div>
                <div class="power-mark"></div>
                <div class="power-mark"></div>
              </div>
              <div class="power-gauge-fill" id="powerBarFill"></div>
            </div>
          </div>

          <!-- 蓄力／發射複合按鈕 -->
          <button class="btn-charge-throw" id="btn-charge" 
                  onmousedown="startCharging()" 
                  onmouseup="releaseThrow()" 
                  ontouchstart="startCharging(event)" 
                  ontouchend="releaseThrow(event)">
            <span>🎯 按住蓄力</span>
            <span style="font-size:12px; font-weight:700; opacity:0.9;">鬆開即可向前發射！</span>
          </button>
        </div>
      </section>
    </div>
  </div>

  <!-- 彈窗 1：登入界面（徹底除錯防呆，保證 100% 登入） -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-card">
      <div style="font-size:52px; margin-bottom:8px;">🎯⌨️</div>
      <h2 style="color:#0284c7; margin-bottom:8px; font-size:24px;">倉頡神射手：四大分類</h2>
      <p style="font-size:14px; color:#64748b; line-height:1.6;">
        歡迎進入飛鏢訓練場！答對字根分類即可解鎖投擲飛鏢機會。
      </p>

      <form class="login-form" id="loginForm" onsubmit="handleLogin(event); return false;">
        <div class="form-group">
          <label for="login-class">班別 (Class)：</label>
          <input type="text" id="login-class" placeholder="例：1A 或 2B" required autofocus 
                 onkeydown="if(event.key==='Enter'){ handleLogin(event); }">
        </div>
        <div class="form-group">
          <label for="login-no">學號 (Class No.)：</label>
          <input type="text" id="login-no" placeholder="例：15" required 
                 onkeydown="if(event.key==='Enter'){ handleLogin(event); }">
        </div>
        <button type="button" class="btn-login" onclick="handleLogin(event)">🚀 開始挑戰</button>
      </form>
    </div>
  </div>

  <!-- 彈窗 2：最終成就結算報告 -->
  <div class="modal-overlay hidden" id="resultModal">
    <div class="modal-card">
      <div style="font-size:54px; margin-bottom:6px;">🏆</div>
      <h2 style="color:#0284c7; margin-bottom:6px;">訓練結算成就報告</h2>
      <p style="font-size:14px; color:#64748b;" id="res-student-text">班別：- ｜ 學號：-</p>

      <div style="margin:18px 0; background:#f0fdf4; border:2px solid #86efac; border-radius:16px; padding:18px; width:100%;">
        <div style="font-size:13.5px; font-weight:800; color:#166534;">最終綜合成績</div>
        <div style="font-size:48px; font-weight:900; color:#15803d; margin:4px 0;" id="res-final-score">0</div>
        <div style="font-size:14px; color:#475569;" id="res-score-detail">
          答題得分：0 ｜ 飛鏢得分：0
        </div>
      </div>

      <p style="font-size:14.5px; font-weight:800; color:#0369a1; margin-bottom:20px;" id="res-eval-text">
        太厲害了！你對倉頡四大分類瞭如指掌，飛鏢命中率極其精準！
      </p>

      <div style="display:flex; gap:12px; width:100%;">
        <button class="btn-login" style="flex:1;" onclick="exportCSV()">📥 匯出成績 CSV</button>
        <button class="btn-login" style="flex:1; background:#64748b;" onclick="restartGame()">🔄 重新開始挑戰</button>
      </div>
    </div>
  </div>

  <script>
    // --- 安全音效系統 (防呆 Web Audio API，防止阻斷登入) ---
    let audioCtx = null;
    function initAudio() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx && AudioContext) {
          audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn("音效啟動被瀏覽器策略限制，遊戲繼續正常進行。");
      }
    }

    function playBeep(freq = 440, type = 'sine', duration = 0.12) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playHitSound(isBullseye = false) {
      if (!audioCtx) return;
      try {
        if (isBullseye) {
          playBeep(523.25, 'triangle', 0.12);
          setTimeout(() => playBeep(659.25, 'triangle', 0.15), 90);
          setTimeout(() => playBeep(1046.50, 'triangle', 0.3), 180);
        } else {
          playBeep(260, 'triangle', 0.12);
        }
      } catch(e) {}
    }

    // --- 遊戲全局狀態 ---
    let currentUser = { className: "1A", classNo: "1" };
    let totalRounds = 10;

    let quizScore = 0;

    // 擴大判定半徑，確保命中判定精準直觀
    const radiusOuter = 160;  // 10分

    let dartState = "AIMING"; // AIMING, FLYING, STUCK

    // --- 徹底修復的登入邏輯（防呆、容錯、雙重隱藏） ---
    function handleLogin(e) {
      if (e) {
        if (typeof e.preventDefault === "function") e.preventDefault();
        if (typeof e.stopPropagation === "function") e.stopPropagation();
      }

      // 嘗試安全初始化音效

      const classInput = document.getElementById("login-class");
      const noInput = document.getElementById("login-no");

      let classNo = noInput ? noInput.value.trim() : "";

        loginModal.classList.add("hidden");

    function startChallenge() {
      // 隨機選題，若不足則循環補充
      questionPool = [...CANGJIE_LETTERS].sort(() => 0.5 - Math.random());
      while (questionPool.length < totalRounds) {
        questionPool = questionPool.concat([...CANGJIE_LETTERS].sort(() => 0.5 - Math.random()));
      }
      currentRoundIndex = 0;
      quizScore = 0;
      dartScore = 0;
      updateHUD();
      showQuizPhase();

    function updateHUD() {
      const elRound = document.getElementById("ui-round");

      if (elRound) elRound.textContent = `${currentRoundIndex + 1} / ${totalRounds}`;
      if (elQuiz) elQuiz.textContent = quizScore;
      if (elDart) elDart.textContent = dartScore;
      if (elTotal) elTotal.textContent = quizScore + dartScore;
    }

    function selectAnswer(chosenCat) {

      const btns = document.querySelectorAll(".btn-opt");

      const fbBox = document.getElementById("quiz-feedback-box");

          fbBox.className = "feedback-box success";
          fbBox.style.display = "block";

        if (fbAnswerBanner) fbAnswerBanner.textContent = `🎉 答對了！+20 分！字根『${activeQuestion.char}』確實屬於【${activeQuestion.category}】！`;
        if (fbHint) fbHint.textContent = `💡 造字原理：${activeQuestion.hint}`;

        if (fbBox) {
          fbBox.className = "feedback-box encouragement";
          fbBox.style.display = "block";
        }

        if (fbAnswerBanner) fbAnswerBanner.textContent = `📌 正確答案是：【${activeQuestion.category}】（你選擇了：${chosenCat}）`;
        if (fbHint) fbHint.textContent = `💡 造字原理：倉頡字母『${activeQuestion.char}』${activeQuestion.hint}`;
        if (fbEncourage) fbEncourage.textContent = `${randomQuote} 雖然這題未能解鎖飛鏢，但每一次認真嘗試都是寶貴的進步！`;

        if (fbActionArea) {
          fbActionArea.innerHTML = `

            <span style="font-size:12.5px; color:#64748b; margin-left:12px; font-weight:700;">(亦可直接按 Enter 鍵)</span>
          `;
        }

        btns.forEach(b => {
          if (b.textContent.trim() === chosenCat) b.classList.add("wrong");
          if (b.textContent.trim() === activeQuestion.category) b.classList.add("correct");
        });
      }
    }

    // 答錯後更換新題目邏輯
    function proceedToNextQuestion() {
      initAudio();
      currentRoundIndex++;
      if (currentRoundIndex < totalRounds) {
        showQuizPhase();
      } else {
        showFinalSummary();
      }
    }

    // 鍵盤 Enter 支援（答錯換題）
    window.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const nextBtn = document.getElementById("btnNextQ");
        // 確保不是在登入視窗輸入時誤觸
        const loginModal = document.getElementById("loginModal");
        const isLoginOpen = loginModal && !loginModal.classList.contains("hidden") && loginModal.style.display !== "none";

        if (nextBtn && !isLoginOpen) {
          e.preventDefault();
          proceedToNextQuestion();
        }
      }
    });

    // --- 階段二：飛鏢階段（加高畫布座標調校） ---
    function randomizeTargetPosition() {
      // 隨機靶盤位置：在加高畫布的舒適瞄準範圍內浮動
      boardCX = Math.round(310 + Math.random() * 200);
      boardCY = Math.round(140 + Math.random() * 80);
    }

    function showDartPhase() {
      const secQuiz = document.getElementById("quiz-section");
      const secDart = document.getElementById("dart-section");
      if (secQuiz) secQuiz.style.display = "none";
      if (secDart) secDart.style.display = "flex";

      randomizeTargetPosition();

      dartState = "AIMING";
      throwPower = 30;
      updatePowerUI();
      const chargeBtn = document.getElementById("btn-charge");
      if (chargeBtn) {
        chargeBtn.disabled = false;
        chargeBtn.classList.remove("charging");
      }

      updateAimAngle();
      renderScene();
    }

    function updateAimAngle() {
      const input = document.getElementById("input-angle");
      if (!input) return;
      throwAngle = parseFloat(input.value);
      const valLabel = document.getElementById("val-angle");
      if (valLabel) {
        valLabel.textContent = `${throwAngle > 0 ? '+' : ''}${throwAngle.toFixed(1)}°`;
      }

      if (dartState === "AIMING") {
        renderScene();
      }
    }

    function updatePowerUI() {
      const valLabel = document.getElementById("val-power");
      const fillBar = document.getElementById("powerBarFill");
      if (valLabel) valLabel.textContent = `${Math.round(throwPower)}%`;
      if (fillBar) fillBar.style.width = `${throwPower}%`;
    }

    // --- 加強版蓄力條機制 ---
    function startCharging(e) {
      if (e && e.type === 'touchstart') e.preventDefault();
      if (dartState !== "AIMING") return;
      initAudio();

      const btn = document.getElementById("btn-charge");
      if (btn) {
        btn.classList.add("charging");
        const span = btn.querySelector("span:first-child");
        if (span) span.textContent = "⚡ 正在強力蓄力...";
      }

      if (chargingInterval) clearInterval(chargingInterval);
      chargeDirection = 1;

      chargingInterval = setInterval(() => {
        throwPower += chargeDirection * 3.5;
        if (throwPower >= 100) {
          throwPower = 100;
          chargeDirection = -1;
        } else if (throwPower <= 25) {
          throwPower = 25;
          chargeDirection = 1;
        }
        updatePowerUI();
      }, 25);
    }

    function releaseThrow(e) {
      if (e && e.type === 'touchend') e.preventDefault();
      if (dartState !== "AIMING") return;
      if (!chargingInterval) return;

      clearInterval(chargingInterval);
      chargingInterval = null;

      const btn = document.getElementById("btn-charge");
      if (btn) {
        btn.classList.remove("charging");
        const span = btn.querySelector("span:first-child");
        if (span) span.textContent = "🎯 按住蓄力";
      }

      executeThrow();
    }

    function calculateLanding() {
      const targetX = dartOriginX + (throwAngle * 9.2);
      const targetY = 270 - (throwPower - 30) * 1.95;
      return { x: targetX, y: targetY };
    }

    function executeThrow() {
      playBeep(360, 'sine', 0.12);
      const btn = document.getElementById("btn-charge");
      if (btn) btn.disabled = true;

      dartState = "FLYING";
      dartLanding = calculateLanding();

      currentFrame = 0;
      flightProgress = 0;
      animateFlight();
    }

    function animateFlight() {
      if (dartState !== "FLYING") return;

      currentFrame++;
      flightProgress = currentFrame / flightDuration;

      renderScene();

      if (currentFrame < flightDuration) {
        requestAnimationFrame(animateFlight);
      } else {
        resolveDartHit();
      }
    }

    // --- 判定得分（紅心 50 分精確判定） ---
    function resolveDartHit() {
      dartState = "STUCK";
      const hitX = dartLanding.x;
      const hitY = dartLanding.y;

      const dist = Math.hypot(hitX - boardCX, hitY - boardCY);

      let gained = 0;
      let toastMsg = "";
      let isBullseye = false;
      let isMiss = false;

      if (dist <= (radiusBull + 4)) {
        gained = 50;
        toastMsg = "🎯 完美正中紅心！BULLSEYE! (+50 分)";
        isBullseye = true;
      } else if (dist <= radiusInner) {
        gained = 30;
        toastMsg = "🌟 命中內金環！(+30 分)";
      } else if (dist <= radiusMiddle) {
        gained = 20;
        toastMsg = "🎯 命中中銀環！(+20 分)";
      } else if (dist <= radiusOuter) {
        gained = 10;
        toastMsg = "👍 命中外綠環！(+10 分)";
      } else {
        gained = 0;
        isMiss = true;
        const missQuote = MISS_ENCOURAGE_QUOTES[Math.floor(Math.random() * MISS_ENCOURAGE_QUOTES.length)];
        toastMsg = missQuote;
      }

      playHitSound(isBullseye);
      dartScore += gained;
      updateHUD();

      const toast = document.getElementById("dartToast");
      if (toast) {
        toast.textContent = toastMsg;
        if (isBullseye) {
          toast.className = "dart-hit-toast show bullseye";
        } else if (isMiss) {
          toast.className = "dart-hit-toast show miss";
        } else {
          toast.className = "dart-hit-toast show";
        }
      }

      renderScene();

      setTimeout(() => {
        if (toast) toast.className = "dart-hit-toast";
        currentRoundIndex++;
        if (currentRoundIndex < totalRounds) {
          showQuizPhase();
        } else {
          showFinalSummary();
        }
      }, 2300);
    }

    // --- 繪製加高版 3D 投擲場景 ---
    function renderScene() {
      if (!ctx) return;
      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      // 背景牆面
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(0, 0, W, H);

      // 地面透視
      ctx.fillStyle = "#cbd5e1";
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(W, H);
      ctx.lineTo(W * 0.85, H - 80);
      ctx.lineTo(W * 0.15, H - 80);
      ctx.closePath();
      ctx.fill();

      // 繪製正面靶盤
      drawFrontDartboard(boardCX, boardCY);

      if (dartState === "AIMING") {
        drawShortAimingGuide();
        drawHandDart(dartOriginX, dartOriginY, 1.45, throwAngle);
      }

      if (dartState === "FLYING") {
        const t = flightProgress;
        const arcHeight = Math.sin(t * Math.PI) * 30;
        const curX = dartOriginX + (dartLanding.x - dartOriginX) * t;
        const curY = (dartOriginY + (dartLanding.y - dartOriginY) * t) - arcHeight;
        const curScale = 1.45 - (1.45 - 0.75) * t;

        drawHandDart(curX, curY, curScale, throwAngle * (1 - t * 0.5));
      }

      if (dartState === "STUCK") {
        drawEmbeddedDart(dartLanding.x, dartLanding.y, 0.75);
      }
    }

    function drawFrontDartboard(cx, cy) {
      ctx.save();
      ctx.shadowColor = "rgba(15, 23, 42, 0.28)";
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 10;
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(cx, cy, radiusOuter + 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = "#15803d";
      ctx.beginPath();
      ctx.arc(cx, cy, radiusOuter, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = "#f8fafc";
      ctx.beginPath();
      ctx.arc(cx, cy, radiusMiddle, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#f59e0b";
      ctx.beginPath();
      ctx.arc(cx, cy, radiusInner, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#dc2626";
      ctx.beginPath();
      ctx.arc(cx, cy, radiusBull, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("50", cx, cy);

      ctx.fillText("30", cx, cy - (radiusInner + radiusBull) / 2);
      ctx.fillStyle = "#1e293b";
      ctx.fillText("20", cx, cy - (radiusMiddle + radiusInner) / 2);
      ctx.fillStyle = "#ffffff";
      ctx.fillText("10", cx, cy - (radiusOuter + radiusMiddle) / 2);
    }

    function drawShortAimingGuide() {
      const guideLength = 80;
      const rad = (throwAngle * Math.PI) / 180;
      const startX = dartOriginX;
      const startY = dartOriginY - 30;
      const endX = startX + Math.sin(rad) * guideLength;
      const endY = startY - Math.cos(rad) * guideLength;

      ctx.save();
      ctx.setLineDash([7, 6]);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3.5;
      ctx.shadowColor = "rgba(2, 132, 199, 0.95)";
      ctx.shadowBlur = 9;

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.arc(endX, endY, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawHandDart(x, y, scale = 1.0, tiltAngle = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.rotate((tiltAngle * Math.PI) / 180);

      ctx.shadowColor = "rgba(0,0,0,0.22)";
      ctx.shadowBlur = 7;
      ctx.shadowOffsetY = 5;

      ctx.strokeStyle = "#cbd5e1";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -24);
      ctx.stroke();

      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(-3.5, 0, 7, 24);
      ctx.fillStyle = "#b45309";
      ctx.fillRect(-3.5, 8, 7, 4);

      ctx.fillStyle = "#1e293b";
      ctx.fillRect(-2, 24, 4, 18);

      ctx.fillStyle = "#dc2626";
      ctx.beginPath();
      ctx.moveTo(0, 32);
      ctx.lineTo(-14, 46);
      ctx.lineTo(0, 42);
      ctx.lineTo(14, 46);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#b91c1c";
      ctx.beginPath();
      ctx.moveTo(-1, 26);
      ctx.lineTo(-4, 44);
      ctx.lineTo(0, 48);
      ctx.lineTo(4, 44);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawEmbeddedDart(x, y, scale = 0.75) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.fillStyle = "rgba(0,0,0,0.32)";
      ctx.beginPath();
      ctx.ellipse(0, 5, 9, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(-3, -12, 6, 16);

      ctx.fillStyle = "#dc2626";
      ctx.beginPath();
      ctx.moveTo(0, -12);
      ctx.lineTo(-11, -24);
      ctx.lineTo(0, -20);
      ctx.lineTo(11, -24);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#b91c1c";
      ctx.beginPath();
      ctx.moveTo(-3, -12);
      ctx.lineTo(-4, -26);
      ctx.lineTo(0, -28);
      ctx.lineTo(4, -26);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    // --- 最終結算 ---
    function showFinalSummary() {
      const finalScore = quizScore + dartScore;
      const elStudent = document.getElementById("res-student-text");
      const elScore = document.getElementById("res-final-score");
      const elDetail = document.getElementById("res-score-detail");
      const elEval = document.getElementById("res-eval-text");

      if (elStudent) elStudent.textContent = `班別：${currentUser.className} ｜ 學號：${currentUser.classNo}`;
      if (elScore) elScore.textContent = finalScore;
      if (elDetail) elDetail.textContent = `答題得分：${quizScore} 分 ｜ 飛鏢得分：${dartScore} 分`;

      let evalMsg = "";
      if (finalScore >= 500) {
        evalMsg = "🌟 神射大師級：倉頡四大分類倒背如流，動態靶心百步穿楊，締造了無可挑剔的神級分數！";
      } else if (finalScore >= 350) {
        evalMsg = "👏 資深特工級：對倉頡 24 個字母具有高超辨識力，隨機靶盤控角與蓄力極其出色！";
      } else {
        evalMsg = "🌱 潛力射手級：已基本掌握四大分類要領，多加練習偏角與蓄力時機，下次必定登上顛峰！";
      }
      if (elEval) elEval.textContent = evalMsg;

      const resModal = document.getElementById("resultModal");
      if (resModal) resModal.classList.remove("hidden");
    }

    // 匯出 CSV 成績單
    function exportCSV() {
      const finalScore = quizScore + dartScore;
      const csvHeader = "班別,學號,答題得分,飛鏢得分,總成績,評級\n";
      let rank = finalScore >= 500 ? "神射大師" : (finalScore >= 350 ? "資深特工" : "潛力射手");
      const csvRow = `"${currentUser.className}","${currentUser.classNo}",${quizScore},${dartScore},${finalScore},"${rank}"\n`;

      const blob = new Blob(["\uFEFF" + csvHeader + csvRow], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `倉頡飛鏢成績_${currentUser.className}_${currentUser.classNo}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function restartGame() {
      const resModal = document.getElementById("resultModal");
      if (resModal) resModal.classList.add("hidden");
      startChallenge();
    }
  </script>
